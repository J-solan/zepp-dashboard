name: Pages

# The demo (made-up data) on GitHub Pages, with no server: the Python backend
# runs in the visitor's browser on Pyodide. Published on every release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            demo/web/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the web in demo mode
        working-directory: frontend
        env:
          VITE_DEMO_WASM: "1"
          VITE_BASE: /zepp-dashboard/
        run: npm run build

      - name: Install Pyodide
        working-directory: demo/web
        run: npm ci

      # Pyodide, the wheels (checked against its lock) and the committed Python code.
      - name: Add Pyodide and the backend
        working-directory: demo/web
        run: node build.mjs ../../frontend/dist

      - name: Smoke test (the API inside Pyodide)
        working-directory: demo/web
        run: node smoke.mjs ../../frontend/dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
