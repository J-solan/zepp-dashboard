# Mapa ejercicio -> músculos con intensidad, semilla de la tabla
# ``exercise_muscle`` (se re-carga con UPSERT en cada ``hevy import``).
#
# La clave de cada tabla es el ``exercise_title`` EXACTO del export de Hevy
# (acentos y paréntesis incluidos): el match es por string literal, así que
# renombrar un ejercicio en Hevy obliga a añadir la nueva clave aquí.
#
# intensity: 0-1. 1.0 = músculo principal (el que va a
# ``workout_set.muscle_group``); los demás ponderan su contribución al volumen
# semanal por músculo. Cada ejercicio necesita EXACTAMENTE un músculo a 1.0.
#
# Nombres de músculo en español y en minúscula, sin acentos, consistentes entre
# ejercicios: pecho, dorsal, trapecio, lumbar, hombro, biceps, triceps,
# antebrazo, core, cuadriceps, femoral, gluteo, aductor, abductor, gemelo.
#
# Semilla anatómicamente razonable de los 12 ejercicios del export real; el
# usuario la ajusta a su criterio sin tocar código.

["Press de Banca Inclinado (Mancuerna)"]
pecho = 1.0
hombro = 0.6
triceps = 0.5

["Jalón al Pecho (Cable)"]
